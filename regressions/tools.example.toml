# Use absolute paths to one consistent installed stack.
# Copy to tools.toml and edit it when switching builds.
[executables]
redstar_bin = "/path/to/redstar/install/bin"
chroma_bin = "/path/to/chroma/install/bin"
dbutil = "/path/to/adat/install/bin/dbutil"
adat_config = "/path/to/adat/install/bin/adat-config"
